<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Fair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
            text-align: center;
        }
        h2 {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            width: 100%;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Play Fair Cipher</h2>
        
        <h4 class="text-primary">Mã hoá</h4>
        <form method="post" action="/playfair/encrypt">
            <div class="mb-3">
                <label class="form-label">Plain text</label>
                <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key" required>
            </div>
            <button type="submit" class="btn btn-primary">Mã hoá</button>
        </form>
        
        <hr>
        
        <h4 class="text-primary">Giải mã</h4>
        <form method="post" action="/playfair/decrypt">
            <div class="mb-3">
                <label class="form-label">Cipher text</label>
                <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="text" class="form-control" name="inputKeyCipher" placeholder="Input Key" required>
            </div>
            <button type="submit" class="btn btn-primary">Giải mã</button>  
        </form>
        
        <hr>
        
        <h4 class="text-primary">Tạo ma trận</h4>
        <form method="post" action="/matrix">
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="text" class="form-control" name="inputKeyPlain" placeholder="Input Key" required>
            </div>
            <button type="submit" class="btn btn-primary">Tạo ma trận</button>
        </form>
    </div>
</body>
</html>
