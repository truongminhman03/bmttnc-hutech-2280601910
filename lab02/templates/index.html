<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành An toàn thông tin nâng cao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }
        h4, h5 {
            text-align: center;
            font-weight: bold;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            background: #007bff;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            transition: transform 0.3s, background 0.3s;
        }
        ul li a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            display: block;
        }
        ul li:hover {
            background: #0056b3;
            transform: scale(1.05);
        }
        img {
            display: block;
            margin: 0 auto 20px;
            width: 40%;
        }
        .icon {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="HUTECH">
        <h4>BÀI THỰC HÀNH BẢO MẬT THÔNG TIN NÂNG CAO</h4>
        <h5 class="mt-4">DANH SÁCH CÁC LOẠI MÃ HÓA</h5>
        <ul class="mt-3">
            <li><a href="/caesar"><i class="fa-solid fa-lock icon"></i>Ceasar Cipher</a></li>
            <li><a href="/vigenere"><i class="fa-solid fa-key icon"></i>Vigenere Cipher</a></li>
            <li><a href="/railfence"><i class="fa-solid fa-bars icon"></i>Rail Fence Cipher</a></li>
            <li><a href="/playfair"><i class="fa-solid fa-chess-board icon"></i>Play Fair Cipher</a></li>
        </ul>
    </div>
</body>
</html>
