<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigenere Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
            text-align: center;
        }
        h2 {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            width: 100%;
            font-size: 18px;
            padding: 12px;
            border-radius: 8px;
        }
        .section {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .encryption {
            background-color: #e3f2fd; /* Xanh nhạt */
        }
        .decryption {
            background-color: #ffebee; /* Đỏ nhạt */
        }
        .icon {
            font-size: 25px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-key"></i> Vigenere Cipher</h2>
        
        <div class="section encryption">
            <h4 class="text-primary"><i class="fas fa-lock"></i> Mã hoá</h4>
            <form method="POST" action="/vigenere/encrypt">
                <div class="mb-3">
                    <label class="form-label">Plain text</label>
                    <input type="text" class="form-control" name="inputPlainText" placeholder="Nhập văn bản" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Khoá:</label>
                    <input type="text" class="form-control" name="inputKeyPlain" placeholder="Nhập khoá" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-lock"></i> Mã hoá</button>
            </form>
        </div>
        
        <div class="section decryption">
            <h4 class="text-danger"><i class="fas fa-unlock"></i> Giải mã</h4>
            <form method="post" action="/vigenere/decrypt">
                <div class="mb-3">
                    <label class="form-label">Cipher text</label>
                    <input type="text" class="form-control" name="inputCipherText" placeholder="Nhập văn bản" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Khoá:</label>
                    <input type="text" class="form-control" name="inputKeyCipher" placeholder="Nhập khoá" required>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-unlock"></i> Giải mã</button>  
            </form>
        </div>
    </div>
</body>
</html>
